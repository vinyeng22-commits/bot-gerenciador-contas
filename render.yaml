services:
  - type: web
    name: bot-gerenciador-contas
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: PYTHON_VERSION
        value: 3.11.9
